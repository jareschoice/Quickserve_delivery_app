name: quickserve
description: "QuickServe Delivery App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.3
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.7
  socket_io_client: ^3.1.3
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_messaging: ^16.0.4
  flutter_native_splash: ^2.4.7
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  webview_flutter: ^4.10.0
  url_launcher: ^6.2.5
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.10.0
  flutter_local_notifications: ^19.5.0
  audioplayers: ^6.1.0
  flutter_rating_bar: ^4.0.1
  local_auth: ^3.0.0  # Fingerprint/Face ID authentication
  # Use a modern QR code scanner plugin for compatibility with latest Gradle
  mobile_scanner: ^7.1.4
  shimmer: ^3.0.0  # Skeleton loading animations
  share_plus: ^12.0.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/Quickserve_icon.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#42a5f5"
  image: assets/images/Quickserve_logo.jpg
  android_gravity: center
  ios_content_mode: center

flutter:
  uses-material-design: true

  assets:
    - assets/images/Quickserve_logo.jpg
    - assets/images/Quickserve_icon.jpg