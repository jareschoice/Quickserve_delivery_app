<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickServe Admin • Register Dispatcher</title>

  <!-- ✅ Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <!-- ✅ Shared Styles -->
  <link rel="stylesheet" href="/event-frontend/css/styles.css" />
  <link rel="stylesheet" href="/event-frontend/css/web-shared.css" />
  <link rel="stylesheet" href="/event-frontend/css/chat-widget.css" />

  <style>
    body {
      background-color: #f8f9fa;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    .register-card {
      max-width: 650px;
      margin: 60px auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
      padding: 40px;
    }

    .register-card h3 {
      background: linear-gradient(135deg, #ff6b00, #ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .btn-submit {
      background: linear-gradient(135deg, #ff6b00, #ffd700);
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 12px;
      width: 100%;
      transition: transform 0.2s ease;
    }

    .btn-submit:hover {
      transform: scale(1.03);
    }

    .alert {
      border-radius: 12px;
    }
  </style>
  <!-- ✅ Audio -->
  <audio id="soundReady" src="/event-frontend/audio/ready.mp3" preload="auto"></audio>
  <audio id="soundDelivered" src="/event-frontend/audio/delivered.mp3" preload="auto"></audio>
</head>
<body>
  <!-- Back to Dashboard -->
  <div class="p-3 border-bottom bg-white sticky-top shadow-sm d-flex align-items-center justify-content-between">
    <a href="admin.html" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </a>
    <h6 class="mb-0 fw-semibold text-secondary">Dispatcher Registration</h6>
  </div>

  <!-- Registration Form -->
  <div class="register-card">
    <div class="text-center mb-4">
      <div class="logo-q" style="width:80px;height:80px;font-size:36px;background:#FFD700;color:#FF6B00;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 15px;">
        Q
      </div>
      <h3>Register New Dispatcher</h3>
      <p class="text-muted">Add a new delivery dispatcher to the QuickServe platform</p>
    </div>

    <form id="dispatcherForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label fw-semibold">Full Name</label>
          <input type="text" id="fullName" class="form-control" placeholder="John Doe" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Phone Number</label>
          <input type="text" id="phone" class="form-control" placeholder="08123456789" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="example@email.com" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Create password" required />
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">Vehicle Type</label>
          <select id="vehicleType" class="form-select">
            <option value="">Select Vehicle</option>
            <option value="bike">Motorbike</option>
            <option value="car">Car</option>
            <option value="van">Van</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-semibold">License Number</label>
          <input type="text" id="licenseNumber" class="form-control" placeholder="Enter license number" />
        </div>
        <div class="col-12">
          <label class="form-label fw-semibold">Address</label>
          <input type="text" id="address" class="form-control" placeholder="Dispatcher address" required />
        </div>
        <div class="col-12">
          <button type="submit" id="submitBtn" class="btn-submit mt-3">
            <i class="bi bi-person-plus"></i> Register Dispatcher
          </button>
        </div>
      </div>
    </form>

    <!-- Alerts -->
    <div id="successMessage" class="alert alert-success mt-3 d-none">
      <i class="bi bi-check-circle"></i> Dispatcher registered successfully!
    </div>
    <div id="errorMessage" class="alert alert-danger mt-3 d-none">
      <i class="bi bi-exclamation-circle"></i> <span id="errorText"></span>
    </div>
  </div>

  <!-- ✅ Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { API_BASE_URL, AUTH_API_URL } from 'js/config.js';

    console.log("🔍 Checking admin authentication...");
    const token = localStorage.getItem('eventToken') || localStorage.getItem('token');
    if (!token) {
      alert("Please login first!");
      window.location.href = "login.html";
      throw new Error("Unauthorized access: no token found");
    }

    console.log("✅ Token verified. Ready for dispatcher registration.");

    document.getElementById("dispatcherForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const vehicleType = document.getElementById("vehicleType").value;
      const licenseNumber = document.getElementById("licenseNumber").value.trim();
      const address = document.getElementById("address").value.trim();

      const errorMsg = document.getElementById("errorMessage");
      const successMsg = document.getElementById("successMessage");
      const errorText = document.getElementById("errorText");
      const submitBtn = document.getElementById("submitBtn");

      errorMsg.classList.add("d-none");
      successMsg.classList.add("d-none");

      if (!fullName || !phone || !email || !password || !address) {
        errorText.textContent = "Please fill in all required fields.";
        errorMsg.classList.remove("d-none");
        return;
      }

      const formData = {
        name: fullName,
        email,
        phone,
        address,
        password,
        vehicleType,
        licenseNumber,
        role: "dispatcher",
      };

      try {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registering...';

        const response = await fetch(${AUTH_API_URL}/register, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: Bearer ${token},
          },
          body: JSON.stringify(formData),
        });

        const data = await response.json();
        console.log("Response:", data);

        if (response.ok) {
          successMsg.classList.remove("d-none");
          document.getElementById("dispatcherForm").reset();
          setTimeout(() => {
            window.location.href = "admin.html";
          }, 2000);
        } else {
          errorText.textContent = data.message || "Failed to register dispatcher.";
          errorMsg.classList.remove("d-none");
        }
      } catch (error) {
        console.error("❌ Network error:", error);
        errorText.textContent = "Network error: " + error.message;
        errorMsg.classList.remove("d-none");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-person-plus"></i> Register Dispatcher';
      }
    });
  </script>

  <!-- ✅ Socket & Modules -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io(window.location.protocol + "//" + window.location.hostname + ":5555");
    socket.on("connect", () => console.log("🟢 Socket connected:", socket.id));
    socket.on("disconnect", () => console.log("🔴 Socket disconnected"));
  </script>
  <script type="module" src="js/socket.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
