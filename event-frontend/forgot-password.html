<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - QuickServe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .forgot-container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .back-btn {
            background: #f0f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .forgot-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .forgot-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #FF6B00;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #FF6B00;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #FF8C00;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .signin-link {
            text-align: center;
            font-size: 14px;
            color: #666;
            margin-top: 24px;
        }

        .signin-link a {
            color: #FF6B00;
            text-decoration: none;
            font-weight: 600;
        }

        .alert-custom {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #ffe6e6;
            color: #cc0000;
        }

        .alert-success {
            background: #FFE8D6;
            color: #FF6B00;
        }

        .info-box {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="forgot-container">
        <button class="back-btn" onclick="window.history.back()">
            <i class="bi bi-arrow-left" style="font-size: 20px;"></i>
        </button>

        <h1 class="forgot-title">Forgot Password?</h1>
        <p class="forgot-subtitle">Enter your email and we'll send you a reset link</p>

        <div id="alertMessage" style="display: none;"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control-custom" id="email" placeholder="john@example.com" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Send Reset Link
            </button>
        </form>

        <div class="info-box">
            <i class="bi bi-info-circle"></i> You'll receive an email with instructions to reset your password. The link will expire in 10 minutes.
        </div>

        <div class="signin-link">
            Remember your password? <a href="signin.html">Sign In</a>
        </div>
    </div>

    <script type="module">
        // Hardcode API URL to avoid import issues
        const API_BASE_URL = 'http://127.0.0.1:5555/api';

        console.log('🔧 API_BASE_URL:', API_BASE_URL);

        const form = document.getElementById('forgotForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertMessage = document.getElementById('alertMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                showAlert('Please enter your email address', 'error');
                return;
            }

            if (!email.includes('@')) {
                showAlert('Please enter a valid email address', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                console.log('🚀 Sending password reset request to:', `${API_BASE_URL}/auth/forgot-password`);

                const response = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();
                console.log('📥 Response:', data);

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Failed to send reset link');
                }

                showAlert('✅ Reset link sent! Check your email inbox.', 'success');
                
                // Clear form
                form.reset();

                // Show additional message
                setTimeout(() => {
                    showAlert('Please check your email (including spam folder) for the reset link.', 'success');
                }, 2000);

            } catch (error) {
                console.error('❌ Forgot password error:', error);
                showAlert(error.message || 'Failed to send reset link. Please try again.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });

        function showAlert(message, type) {
            alertMessage.className = `alert-custom alert-${type}`;
            alertMessage.textContent = message;
            alertMessage.style.display = 'block';

            setTimeout(() => {
                alertMessage.style.display = 'none';
            }, 8000);
        }
    </script>

<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
