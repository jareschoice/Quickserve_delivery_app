<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickServe Admin • Vendors</title>

  <!-- ✅ Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />

  <!-- ✅ Shared Styles -->
  <link rel="stylesheet" href="/event-frontend/css/styles.css" />
  <link rel="stylesheet" href="/event-frontend/css/web-shared.css" />
  <link rel="stylesheet" href="/event-frontend/css/chat-widget.css" />

  <style>
    body.admin-wide {
      background-color: #f8f9fa;
      font-family: "Segoe UI", Roboto, sans-serif;
    }

    .list-group-item {
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      transition: all 0.2s ease;
    }

    .list-group-item:hover {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
      transform: translateY(-2px);
    }

    .form-check-input:checked {
      background-color: #28a745;
      border-color: #28a745;
    }
  </style>

  <!-- ✅ Audio preload -->
  <audio id="soundReady" src="/event-frontend/audio/ready.mp3" preload="auto"></audio>
  <audio id="soundDelivered" src="/event-frontend/audio/delivered.mp3" preload="auto"></audio>
</head>
<body class="admin-wide">

  <!-- ========================= -->
  <!-- 🔹 Header Section -->
  <!-- ========================= -->
  <div class="p-3 border-bottom bg-white d-flex align-items-center gap-2 sticky-top shadow-sm">
    <a href="admin.html" class="btn btn-outline-secondary btn-sm" title="Back to dashboard">
      <i class="bi bi-arrow-left"></i>
    </a>
    <h5 class="mb-0 fw-semibold">Manage Vendors</h5>
    <div class="ms-auto" style="max-width: 250px;">
      <input id="search" type="text" class="form-control form-control-sm" placeholder="Search vendors...">
    </div>
  </div>

  <!-- ========================= -->
  <!-- 🔹 Vendor List -->
  <!-- ========================= -->
  <div class="p-3">
    <div id="list" class="list-group"></div>
  </div>

  <!-- ========================= -->
  <!-- 🔹 Vendor Row Template -->
  <!-- ========================= -->
  <template id="rowTpl">
    <div class="list-group-item py-3">
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <div class="fw-semibold flex-grow-1">
          <div class="d-flex align-items-center gap-2">
            <span class="me-2 badge bg-success" data-badge></span>
            <span data-name>Vendor</span>
            <span class="badge rounded-pill bg-secondary ms-2" data-category></span>
          </div>
          <div class="text-muted small" data-address></div>
          <div class="text-muted small" data-email></div>
        </div>
        <div class="btn-group ms-auto">
          <button class="btn btn-sm btn-outline-primary" data-edit><i class="bi bi-pencil"></i></button>
          <button class="btn btn-sm btn-outline-danger" data-delete><i class="bi bi-trash"></i></button>
        </div>
      </div>

      <form class="row g-2 mt-2 d-none" data-form>
        <div class="col-6"><input class="form-control form-control-sm" name="businessName" placeholder="Business Name"></div>
        <div class="col-6"><input class="form-control form-control-sm" name="category" placeholder="Category"></div>
        <div class="col-8"><input class="form-control form-control-sm" name="businessAddress" placeholder="Address"></div>
        <div class="col-4"><input class="form-control form-control-sm" name="businessPhone" placeholder="Phone"></div>
        <div class="col-12 d-flex justify-content-between">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="isActive" id="activeChk">
            <label class="form-check-label" for="activeChk">Active</label>
          </div>
          <button type="button" class="btn btn-sm btn-primary" data-save>Save</button>
        </div>
      </form>
    </div>
  </template>

  <!-- ========================= -->
  <!-- ✅ Scripts Section -->
  <!-- ========================= -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Admin vendor realtime notifications (uses shared socket client) -->
  <script type="module">
    import socketClient from 'js/socket.js';

    const socket = socketClient;

    function showToast(title, message) {
      const toast = document.createElement('div');
      toast.className = 'toast show shadow-lg position-fixed top-0 end-0 m-3';
      toast.style.zIndex = 9999;
      toast.innerHTML = `
        <div class="toast-header bg-success text-white">
          <strong class="me-auto">${title}</strong>
          <small>Now</small>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">${message}</div>
      `;
      document.body.appendChild(toast);
      try { new Audio('/event-frontend/audio/notification.mp3').play().catch(()=>{}); } catch {}
      setTimeout(() => toast.remove(), 6000);
    }

    if (socket) {
      socket.on('vendor:updated', (data) => {
        console.log('🔄 Vendor updated:', data);
        showToast('Vendor Updated', `${data.businessName || data.name || 'Vendor'} has been modified.`);
      });

      socket.on('vendor:deleted', (data) => {
        console.log('❌ Vendor deleted:', data);
        showToast('Vendor Removed', `${data.businessName || data.name || 'Vendor'} has been deleted.`);
      });
    }
  </script>

  <!-- ✅ Page Modules -->
  <script type="module" src="js/socket.js"></script>
  <script type="module" src="js/admin-vendors.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
