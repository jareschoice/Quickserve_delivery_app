<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe • Shops</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/web-shared.css">
  <link rel="stylesheet" href="css/home-style.css">
  <style>
    .vendor-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px;display:flex;gap:12px;cursor:pointer;transition:all 0.3s}
    .vendor-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
    .vendor-thumb{width:100px;height:100px;background:linear-gradient(135deg,#FFE8D6,#FFF5EB);display:flex;align-items:center;justify-content:center;font-weight:800;color:#FF6B00;font-size:32px}
    .vendor-body{padding:16px 12px;flex:1}
    .tab{padding:8px 16px;border-radius:999px;background:#f7f7f7;cursor:pointer;white-space:nowrap;transition:all 0.3s;border:2px solid transparent}
    .tab.active{background:#FFE8D6;color:#FF6B00;font-weight:700;border-color:#FF6B00}
    .tab:hover{background:#FFE8D6}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:#fff;border:1px solid #eee;cursor:pointer;transition:all 0.3s}
    .chip:hover{border-color:#FF6B00;background:#FFF5EB}
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm web-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="home.html">
        <div class="logo-circle">Q</div>
        <span class="brand-text">QuickServe</span>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="home.html"><i class="bi bi-house-fill"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="shops.html"><i class="bi bi-basket"></i> Shops</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="pharmacies.html"><i class="bi bi-capsule"></i> Pharmacies</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-open-chat><i class="bi bi-chat-dots"></i> Support</a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-primary rounded-pill px-4" href="profile.html">
              <i class="bi bi-person-circle"></i> Profile
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container page-container">
    <div class="row mb-4">
      <div class="col-12">
        <h1 class="display-6 fw-bold"><i class="bi bi-basket"></i> Shops</h1>
        <p class="text-muted">Browse shops, supermarkets, and more</p>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <div class="d-flex gap-2 overflow-auto pb-2 mb-3" id="tabs">
          <div class="tab active" data-k="all">All</div>
          <div class="tab" data-k="supermarket">Supermarkets</div>
          <div class="tab" data-k="minimart">Mini Marts</div>
          <div class="tab" data-k="deli">Delis</div>
          <div class="tab" data-k="kiosk">Kiosks</div>
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input id="search" type="text" class="form-control" placeholder="Clothing, electronics, groceries, etc">
        </div>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-12">
        <div class="d-flex gap-2 flex-wrap">
          <div class="chip"><i class="bi bi-cake"></i> Bakery</div>
          <div class="chip"><i class="bi bi-bucket"></i> Cleaning</div>
          <div class="chip"><i class="bi bi-egg-fried"></i> Fruits</div>
          <div class="chip"><i class="bi bi-snow"></i> Frozen Food</div>
        </div>
      </div>
    </div>

    <div id="list"></div>
  </div>

  <!-- Bottom Navigation (Mobile Only) -->
  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <i class="bi bi-house-fill"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-search"></i>
      <span>Search</span>
    </a>
    <a href="checkout.html" class="nav-item">
      <i class="bi bi-bag"></i>
      <span>Orders</span>
    </a>
    <a href="#" class="nav-item" data-open-chat>
      <i class="bi bi-chat-dots"></i>
      <span>Support</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="bi bi-person-circle"></i>
      <span>Profile</span>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/shops.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
