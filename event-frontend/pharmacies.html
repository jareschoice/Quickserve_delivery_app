<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe • Pharmacies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/home-style.css">
  <style>
    .page-header{background:#fff;position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .search-wrap{padding:12px 16px}
    .pharm-card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);margin:12px 16px}
    .pharm-banner{height:140px;background:linear-gradient(135deg,#FFE8D6,#FFF5EB);display:flex;align-items:center;justify-content:center}
    .pharm-body{padding:12px}
  </style>
</head>
<body>
  <div class="page-header">
    <button class="btn btn-link" onclick="history.back()" title="Back" aria-label="Back"><i class="bi bi-arrow-left"></i></button>
    <div class="flex-grow-1 fw-semibold">Pharmacies</div>
    <button class="btn btn-outline-secondary btn-sm"><i class="bi bi-sliders"></i> Filter</button>
  </div>

  <div class="search-wrap">
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input id="search" type="text" class="form-control" placeholder="Painkillers, Cough syrup etc.">
    </div>
  </div>

  <div id="list"></div>

  <script type="module" src="js/pharmacies.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
