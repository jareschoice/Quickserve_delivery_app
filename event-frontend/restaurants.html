<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe • Restaurants</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/web-shared.css">
  <link rel="stylesheet" href="css/home-style.css">
  <style>
    .vendor-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px;display:flex;gap:12px;transition:all 0.3s}
    .vendor-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(-2px)}
    .vendor-thumb{width:100px;height:100px;background:linear-gradient(135deg,#FFE8D6,#FFF5EB);display:flex;align-items:center;justify-content:center;font-weight:800;color:#FF6B00;font-size:32px}
    .vendor-body{padding:16px 12px;flex:1}
    .rating{color:#f4b400;font-weight:600}
    .chip{display:inline-block;padding:8px 14px;border-radius:999px;background:#f7f7f7;margin-right:8px;margin-bottom:8px;font-size:13px;cursor:pointer;transition:background 0.3s}
    .chip:hover{background:#FFE8D6}
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm web-navbar">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="home.html">
        <div class="logo-circle">Q</div>
        <span class="brand-text">QuickServe</span>
      </a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" href="home.html"><i class="bi bi-house-fill"></i> Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="restaurants.html"><i class="bi bi-shop"></i> Restaurants</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="shops.html"><i class="bi bi-basket"></i> Shops</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" data-open-chat><i class="bi bi-chat-dots"></i> Support</a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-outline-primary rounded-pill px-4" href="checkout.html">
              <i class="bi bi-bag"></i> Cart <span class="badge bg-primary ms-1" id="cartCount">0</span>
            </a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-primary rounded-pill px-4" href="profile.html">
              <i class="bi bi-person-circle"></i> Profile
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container page-container">
    <div class="row mb-4">
      <div class="col-12">
        <h1 class="display-6 fw-bold"><i class="bi bi-shop"></i> Restaurants</h1>
        <p class="text-muted">Order from your favorite restaurants</p>
      </div>
    </div>
    
    <div class="row mb-4">
      <div class="col-12">
        <div class="input-group input-group-lg">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input id="search" type="text" class="form-control" placeholder="Search dishes, vendors…">
        </div>
        <div class="mt-3">
          <span class="chip"><i class="bi bi-lightning-fill"></i> Instant Delivery</span>
          <span class="chip"><i class="bi bi-clock"></i> Open Now</span>
          <span class="chip"><i class="bi bi-tag-fill"></i> Promo</span>
          <span class="chip"><i class="bi bi-star-fill"></i> Top Rated</span>
        </div>
      </div>
    </div>
    
    <div id="list" class="row"></div>
  </div>

  <!-- Bottom Navigation (Mobile Only) -->
  <div class="bottom-nav">
    <a href="home.html" class="nav-item">
      <i class="bi bi-house-fill"></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <i class="bi bi-search"></i>
      <span>Search</span>
    </a>
    <a href="checkout.html" class="nav-item">
      <i class="bi bi-bag"></i>
      <span>Orders</span>
    </a>
    <a href="#" class="nav-item" data-open-chat>
      <i class="bi bi-chat-dots"></i>
      <span>Support</span>
    </a>
    <a href="profile.html" class="nav-item">
      <i class="bi bi-person-circle"></i>
      <span>Profile</span>
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/restaurants.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
