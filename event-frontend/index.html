<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickServe - Fast Food Delivery</title>
    <link rel="stylesheet" href="css/chat-widget.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            text-align: center;
            animation: fadeIn 0.8s ease-in;
        }

        .logo-icon {
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: scaleIn 0.8s ease-out;
        }

        .logo-q {
            font-size: 120px;
            font-weight: 900;
            color: #FFD700;
            text-shadow: 
                3px 3px 0px rgba(0, 0, 0, 0.2),
                6px 6px 20px rgba(0, 0, 0, 0.15);
            font-family: Georgia, serif;
            line-height: 1;
        }

        .brand-name {
            font-size: 56px;
            font-weight: 700;
            color: #FFD700;
            text-shadow: 
                2px 2px 0px rgba(0, 0, 0, 0.2),
                4px 4px 15px rgba(0, 0, 0, 0.15);
            letter-spacing: -1px;
            margin-bottom: 16px;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        .tagline {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.95);
            font-weight: 500;
            letter-spacing: 2px;
            animation: slideUp 0.8s ease-out 0.4s both;
        }

        .loading-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
            animation: slideUp 0.8s ease-out 0.6s both;
        }

        .dot {
            width: 12px;
            height: 12px;
            background: #FFD700;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        .dot:nth-child(3) { animation-delay: 0; }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }

        /* Chat widget now uses shared CSS (css/chat-widget.css) */
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-icon">
            <div class="logo-q">Q</div>
        </div>
        <h1 class="brand-name">QuickServe</h1>
        <p class="tagline">FAST FOOD DELIVERY</p>
        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

 <script>
window.addEventListener("load", () => {
  console.log("Splash loaded, redirecting...");
  setTimeout(() => {
    const redirectURL = window.location.protocol + "//" + window.location.host + "/event-frontend/home.html";
    console.log("Redirecting to:", redirectURL);
    window.location.assign(redirectURL);
  }, 3000);
});
</script>
    <script type="module" src="js/chat-widget.js"></script>
    <!-- ✅ Socket & Modules -->
<script src="/socket.io/socket.io.js"></script>
<script type="module" src="js/socket.js"></script>
<script type="module" src="js/home.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
