<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickServe • Send Packages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/home-style.css">
  <style>
    .page-header{background:#fff;position:sticky;top:0;z-index:20;padding:12px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .hero{padding:16px}
    .cta-card{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:16px;display:flex;gap:12px;align-items:center;margin:12px 16px;cursor:pointer;border:1px solid #f1f1f1}
    .cta-card:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
    .cta-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#F2F6FF;color:#1D4ED8;font-size:22px}
    .divider{height:1px;background:#eee;margin:16px 0}
    .form-wrap{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:16px;margin:0 16px 24px}
  </style>
</head>
<body>
  <div class="page-header">
    <button class="btn btn-link" onclick="history.back()" title="Back" aria-label="Back"><i class="bi bi-arrow-left"></i></button>
    <div class="flex-grow-1 fw-semibold">Send Packages</div>
  </div>

  <div class="hero">
    <div class="cta-card" id="sendCard">
      <div class="cta-icon"><i class="bi bi-box-seam"></i></div>
      <div class="flex-grow-1">
        <div class="fw-semibold">Send a package</div>
        <div class="text-muted small">Door‑to‑door delivery within your city</div>
      </div>
      <i class="bi bi-chevron-right text-muted"></i>
    </div>

    <div class="cta-card" id="requestCard">
      <div class="cta-icon" style="background:#FFF7ED;color:#C2410C"><i class="bi bi-bicycle"></i></div>
      <div class="flex-grow-1">
        <div class="fw-semibold">Request a rider</div>
        <div class="text-muted small">Point‑to‑point pickup for errands</div>
      </div>
      <i class="bi bi-chevron-right text-muted"></i>
    </div>
  </div>

  <div class="form-wrap" id="formWrap" hidden>
    <div class="mb-2 fw-semibold">Package details</div>
    <div class="mb-2">
      <label class="form-label">Pickup address</label>
      <input type="text" class="form-control" id="pickup" placeholder="e.g. 12 Adeola Odeku, VI">
    </div>
    <div class="mb-2">
      <label class="form-label">Dropoff address</label>
      <input type="text" class="form-control" id="dropoff" placeholder="e.g. 4 Allen Avenue, Ikeja">
    </div>
    <div class="mb-2">
      <label class="form-label">Package size</label>
      <select id="size" class="form-select">
        <option value="small">Small (0–2kg)</option>
        <option value="medium">Medium (2–5kg)</option>
        <option value="large">Large (5–10kg)</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Notes (optional)</label>
      <textarea id="notes" class="form-control" rows="2" placeholder="Fragile, handle with care..."></textarea>
    </div>
    <div class="d-grid">
      <button id="submitBtn" class="btn btn-primary">Get estimate</button>
    </div>
    <div id="estimate" class="mt-3 text-muted small" hidden></div>
  </div>

  <script type="module" src="js/send-packages.js"></script>
<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
