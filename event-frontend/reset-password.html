<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - QuickServe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF6B00 0%, #FF8C00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-container {
            background: white;
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .reset-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .reset-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: #FF6B00;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #FF6B00;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            margin-top: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-submit:hover {
            background: #FF8C00;
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .alert-custom {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .alert-error {
            background: #ffe6e6;
            color: #cc0000;
        }

        .alert-success {
            background: #FFE8D6;
            color: #FF6B00;
        }

        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <h1 class="reset-title">Reset Password</h1>
        <p class="reset-subtitle">Enter your new password</p>

        <div id="alertMessage" style="display: none;"></div>

        <form id="resetForm">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control-custom" id="password" placeholder="Enter new password" required>
                <div class="password-requirements">At least 6 characters</div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control-custom" id="confirmPassword" placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Reset Password
            </button>
        </form>
    </div>

    <script type="module">
        // Hardcode API URL to avoid import issues
        const API_BASE_URL = 'http://127.0.0.1:5555/api';

        const form = document.getElementById('resetForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertMessage = document.getElementById('alertMessage');

        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        console.log('🔧 Token from URL:', token);
        console.log('🔧 API_BASE_URL:', API_BASE_URL);

        if (!token) {
            showAlert('Invalid reset link. Please request a new one.', 'error');
            submitBtn.disabled = true;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!password || !confirmPassword) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must be at least 6 characters', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                console.log('🚀 Sending password reset to:', `${API_BASE_URL}/auth/reset-password/${token}`);

                const response = await fetch(`${API_BASE_URL}/auth/reset-password/${token}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();
                console.log('📥 Response:', data);

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Failed to reset password');
                }

                showAlert('✅ Password reset successful!', 'success');
                
                // Redirect to signin after 2 seconds
                setTimeout(() => {
                    window.location.href = 'signin.html';
                }, 2000);

            } catch (error) {
                console.error('❌ Reset password error:', error);
                showAlert(error.message || 'Failed to reset password. Please try again.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        function showAlert(message, type) {
            alertMessage.className = `alert-custom alert-${type}`;
            alertMessage.textContent = message;
            alertMessage.style.display = 'block';
        }
    </script>

<audio id="readySound" preload="auto" src="/event-frontend/audio/ready.mp3"></audio>
<audio id="deliveredSound" preload="auto" src="/event-frontend/audio/delivered.mp3"></audio>
</body>
</html>
