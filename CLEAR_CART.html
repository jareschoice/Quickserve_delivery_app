<!DOCTYPE html>
<html>
<head>
    <title>Clear Cart Data</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FF6B00, #FFD700);
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #FF6B00;
            margin-bottom: 20px;
        }
        button {
            background: linear-gradient(135deg, #FF6B00, #FFD700);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        .success {
            color: green;
            font-weight: bold;
            margin-top: 20px;
        }
        .info {
            color: #666;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Clear Cart Data</h1>
        <p class="info">
            This will remove all old cart data showing deleted vendors.<br>
            Your new test vendors will work properly after clearing.
        </p>
        <button onclick="clearCart()">Clear Cart</button>
        <button onclick="clearAll()">Clear All Data</button>
        <div id="message"></div>
        <br><br>
        <a href="http://localhost:5555/event-frontend/home.html" style="color: #FF6B00; text-decoration: none; font-weight: bold;">
            ← Back to Home
        </a>
    </div>

    <script>
        function clearCart() {
            localStorage.removeItem('cart');
            localStorage.removeItem('vendorId');
            document.getElementById('message').innerHTML = '<p class="success">✅ Cart cleared! Refresh any page to see changes.</p>';
        }

        function clearAll() {
            localStorage.clear();
            document.getElementById('message').innerHTML = '<p class="success">✅ All data cleared! You\'ll need to log in again.</p>';
        }
    </script>
</body>
</html>
